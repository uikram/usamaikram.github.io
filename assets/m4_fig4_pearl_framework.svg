    <text x="16" y="140" font-size="15.5" font-weight="bold" fill="#7a9fc7">Functioning (4)</text>
    <g font-size="14.5" fill="#222222">
      <text x="20" y="165">· Family structure</text><text x="214" y="165" text-anchor="end">11</text>
      <text x="20" y="189">· Family cohesion and</text>
      <text x="28" y="208">conflict</text><text x="214" y="208" text-anchor="end">6</text>
      <text x="20" y="232">· Family emotional</text>
      <text x="28" y="251">climate</text><text x="214" y="251" text-anchor="end">1</text>
      <text x="20" y="275">· Sibling and birth-order</text>
      <text x="28" y="290">effects</text><text x="214" y="290" text-anchor="end">3</text>
    </g>

    <!-- Sub-domain 2 -->
    <rect x="4" y="308" width="226" height="214" rx="6" fill="#ffffff" stroke="#7a9fc7" stroke-width="1.3"/>
    <text x="16" y="332" font-size="15.5" font-weight="bold" fill="#7a9fc7">Social and Healthcare</text>
    <text x="16" y="352" font-size="15.5" font-weight="bold" fill="#7a9fc7">Relationships (3)</text>
    <g font-size="14.5" fill="#222222">
      <text x="20" y="377">· Parental involvement</text>
      <text x="28" y="396">and supervision</text><text x="214" y="396" text-anchor="end">8</text>
      <text x="20" y="420">· Peer and social</text>
      <text x="28" y="439">support</text><text x="214" y="439" text-anchor="end">2</text>
      <text x="20" y="463">· Patient-provider</text>
      <text x="28" y="482">communication and</text>
      <text x="28" y="501">clinical support</text><text x="214" y="501" text-anchor="end">4</text>
    </g>
  </g>

  <!-- ================= COLUMN 5: L ================= -->
  <g transform="translate(1050, 20)">
    <!-- Header -->
    <rect x="0" y="0" width="234" height="58" fill="#f1c49d"/>
    <text x="117" y="21" font-size="23" font-weight="bold" fill="#ffffff" text-anchor="middle">L</text>
    <text x="117" y="36" font-size="13.5" fill="#ffffff" text-anchor="middle">Lifestyle, Learning &amp;</text>
    <text x="117" y="51" font-size="13.5" fill="#ffffff" text-anchor="middle">Living Environment</text>
    <text x="117" y="80" font-size="14.5" font-style="italic" fill="#333333" text-anchor="middle">10 factors</text>

    <!-- Sub-domain 1 -->
    <rect x="4" y="96" width="226" height="258" rx="6" fill="#ffffff" stroke="#e5b993" stroke-width="1.3"/>
    <text x="16" y="120" font-size="15.5" font-weight="bold" fill="#d99b66">Socioeconomic and</text>
    <text x="16" y="140" font-size="15.5" font-weight="bold" fill="#d99b66">Demographic Context (5)</text>
    <g font-size="14.5" fill="#222222">
      <text x="20" y="165">· Household</text>
      <text x="28" y="184">socioeconomic status</text><text x="214" y="184" text-anchor="end">12</text>
      <text x="20" y="208">· Parental education</text><text x="214" y="208" text-anchor="end">12</text>
      <text x="20" y="232">· Parental occupation</text><text x="214" y="232" text-anchor="end">4</text>
      <text x="20" y="256">· Race, ethnicity, and</text>
      <text x="28" y="275">minority status</text><text x="214" y="275" text-anchor="end">6</text>
      <text x="20" y="299">· Place of residence and</text>
      <text x="28" y="318">healthcare access</text>
      <text x="28" y="337">context</text><text x="214" y="337" text-anchor="end">4</text>
    </g>

    <!-- Sub-domain 2 -->
    <rect x="4" y="368" width="226" height="128" rx="6" fill="#ffffff" stroke="#e5b993" stroke-width="1.3"/>
    <text x="16" y="392" font-size="15.5" font-weight="bold" fill="#d99b66">School and Daily</text>
    <text x="16" y="412" font-size="15.5" font-weight="bold" fill="#d99b66">Environment (2)</text>
    <g font-size="14.5" fill="#222222">
      <text x="20" y="437">· Academic performance</text><text x="214" y="437" text-anchor="end">1</text>
      <text x="20" y="461">· School support for</text>
      <text x="28" y="480">diabetes</text><text x="214" y="480" text-anchor="end">1</text>
    </g>

    <!-- Sub-domain 3 -->
    <rect x="4" y="510" width="226" height="168" rx="6" fill="#ffffff" stroke="#e5b993" stroke-width="1.3"/>
    <text x="16" y="534" font-size="15.5" font-weight="bold" fill="#d99b66">Lifestyle Behaviours</text>
    <text x="16" y="554" font-size="15.5" font-weight="bold" fill="#d99b66">(3)</text>
    <g font-size="14.5" fill="#222222">
      <text x="20" y="579">· Dietary habits and</text>
      <text x="28" y="598">nutrition</text><text x="214" y="598" text-anchor="end">5</text>
      <text x="20" y="622">· Physical activity and</text>
      <text x="28" y="641">screen time</text><text x="214" y="641" text-anchor="end">6</text>
      <text x="20" y="665">· Sleep quality</text><text x="214" y="665" text-anchor="end">1</text>
    </g>
  </g>
</svg>
